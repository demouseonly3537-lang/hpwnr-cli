name: build

on:
  workflow_dispatch:
    inputs:
      individual_binaries:
        description: "Upload each binary on its own instead of two zip archives"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy and tests (full)
        run: |
          cargo clippy --release --all-targets --locked -- -D warnings
          cargo test --release --locked
      - name: Clippy and tests (lite)
        run: |
          cargo clippy --release --no-default-features --all-targets --locked -- -D warnings
          cargo test --release --no-default-features --locked
  build:
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: full, target: x86_64-unknown-linux-musl, asset: linux-x86_64, os: ubuntu-latest, tool: cross }
          - { variant: full, target: aarch64-linux-android, asset: android-arm64, os: ubuntu-latest, tool: cross }
          - { variant: lite, target: aarch64-linux-android, asset: android-arm64, os: ubuntu-latest, tool: cross }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        if: matrix.tool == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build
        run: |
          if [ "${{ matrix.variant }}" = "lite" ]; then
            FEATURES="--no-default-features"
          else
            FEATURES=""
          fi
          if [ "${{ matrix.tool }}" = "cross" ]; then
            cross build --release --target ${{ matrix.target }} --locked $FEATURES
          else
            cargo build --release --target ${{ matrix.target }} --locked $FEATURES
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hpwnr-${{ matrix.variant }}-${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/hpwnr*
